name: Deploy Google Apps Script (DEV/PROD)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v4

        - uses: actions/setup-node@v4
          with:
            node-version: '20'
        
        - name: Install clasp
          run: npm install -g @google/clasp
        
        - name: Configure clasp auth
          run: echo "$CLASPRC_JSON" > ~/.clasprc.json
          env:
            CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        - name: Select scriptId
          run: |
            if [ "$GITHUB_REF_NAME" == "main" ]; then
              echo '{ "scriptID": "'"${SCRIPT_ID_PROD}"'" }' > ~/.clasp.json
              echo "Deploying to PRODUCTION sheet"
            else
              echo '{ "scriptID": "'"${SCRIPT_ID_DEV}"'" }' > ~/.clasp.json
              echo "Deploying to DEV sheet"
            fi
          env:
            SCRIPT_ID_PROD: ${{ secrets.SCRIPT_ID_PROD }} 
            SCRIPT_ID_DEV: ${{ secrets.SCRIPT_ID_DEV }}
        
        - name: Deploy to Google Apps Script
          run: clasp push
        
        - name: Create new version
          run: clasp version "Deploy $GITHUB_REF_NAME $GITHUB_SHA"