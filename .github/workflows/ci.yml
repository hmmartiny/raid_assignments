name: CI

on:
  pull_request:
    branches: [main]

jobs:
  validate-js:
    name: js-sanity-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Basic JS syntax
        run: | 
            for file in $(find . -name "*.js"); do
              node --check "$file"
            done